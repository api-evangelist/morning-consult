  schemas:
    Question:
      title: Question
      description: The representation of a survey question and its relevant metadata.
      type: object
      example:
        id: cbaad021-12b7-5cd2-9a0f-3ed556946d0d
        label: Avon Usage Frequency
        text: How often do you use or purchase something from the following? --- Avon
        country:
          code: fr
          label: France
        category:
          id: brand
          label: Brand
        responses:
        - id: '1'
          label: Several times a day
        - id: '2'
          label: About once a day
        - id: '3'
          label: A few times a week
        - id: '4'
          label: About once a week
        - id: '5'
          label: About once a month or less often
        - id: '6'
          label: I do not have an account or do not use
        entity:
          id: avon
          label: Avon
      properties:
        id:
          $ref: '#/components/schemas/QuestionID'
        label:
          type: string
          description: A short label describing the question.
        text:
          type: string
          description: The full text of the question, as shown to respondents. For questions that we do not ask directly, such as certain demographic questions, this field will be omitted.
        country:
          $ref: '#/components/schemas/Country'
        category:
          $ref: '#/components/schemas/Category'
        responses:
          $ref: '#/components/schemas/Responses'
        entity:
          $ref: '#/components/schemas/Entity'
    PaginationToken:
      type: string
      format: base64
      description: A pagination token to use to get paginated results. For more details, see the section on [Pagination](#pagination).
      pattern: ^(?:[A-Za-z\d+/]{4})*(?:[A-Za-z\d+/]{3}=|[A-Za-z\d+/]{2}==)?$
      minLength: 3
      maxLength: 300
      example: eyJxdWVyeSI6ImRvZ3MifQ==
    ResponseID:
      title: ResponseID
      type: string
      pattern: ^[0-9]+$
      minLength: 0
      maxLength: 100
      description: Unique identifier for a question response. Response IDs are only unique within a question, and not across them.
      example: '1'
    Responses:
      type: array
      description: The response IDs and labels for the question.
      items:
        $ref: '#/components/schemas/Response'
    EntityType:
      title: EntityType
      description: A entity type, such as brand or favorability.
      properties:
        id:
          type: string
          description: The ID of the entity type, which can be used for filtering entities.
        label:
          type: string
          description: The descriptive label of the entity type.
      example:
        id: favorability
        label: Favorability
    GetResponsesBulkStatusOutput:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          description: The unique identifier for the bulk responses request.
          example: b1a2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          type: string
          description: The current status of the report request.
          enum:
          - processing
          - complete
          - error
          example: complete
        download_url:
          type: string
          format: uri
          description: URL to download the completed report. Only present when status is `complete`.
          example: https://example.com/report.parquet
        expires_at:
          type: string
          format: date-time
          description: Expiration time of the download URL. Only present when status is `complete`.
          example: '2025-01-01T12:00:00Z'
    Category:
      title: Category
      type: object
      description: A type of question.
      properties:
        id:
          type: string
          description: The ID of the category, which can be used for filtering questions and entities.
        label:
          type: string
          description: The descriptive label for the category.
      example:
        id: brand
        label: Brand
    DataSourceQuestion:
      title: Data Source Question
      description: A question across accessible data sources.
      type: object
      required:
      - id
      - label
      - country
      - data_source_id
      example:
        id: cbaad021-12b7-5cd2-9a0f-3ed556946d0d
        label: Avon Usage Frequency
        text: How often do you use or purchase something from the following? --- Avon
        data_source_id: 00de2081-e013-411d-823c-cd483283e38d
        country:
          code: fr
          label: France
        category:
          id: brand
          label: Brand
        responses:
        - id: '1'
          label: Several times a day
        - id: '2'
          label: About once a day
        - id: '3'
          label: A few times a week
        - id: '4'
          label: About once a week
        - id: '5'
          label: About once a month or less often
        - id: '6'
          label: I do not have an account or do not use
        entity:
          id: avon
          label: Avon
      properties:
        id:
          $ref: '#/components/schemas/QuestionID'
        label:
          type: string
          description: A short label describing the question.
        text:
          type: string
          description: The full text of the question, as shown to respondents. For questions that we do not ask directly, such as certain demographic questions, this field will be omitted.
        data_source_id:
          $ref: '#/components/schemas/DataSourceID'
        country:
          $ref: '#/components/schemas/Country'
        category:
          $ref: '#/components/schemas/Category'
        responses:
          $ref: '#/components/schemas/Responses'
        entity:
          $ref: '#/components/schemas/Entity'
    Entity:
      title: Entity
      type: object
      description: A particular subject to which a question may refer, such as a specific brand or politician.
      properties:
        id:
          type: string
          description: The ID of the entity, which can be used for filtering questions.
        label:
          type: string
          description: The descriptive label of the entity, usually the name.
      example:
        id: autotrader
        label: Autotrader
    ScoreID:
      title: Score ID
      description: The unique identifier for a score.
      type: string
      format: uuid
      example: 7fa7d4a5-8b79-462c-b9ae-03a0431cb5e5
    CountryCode:
      title: CountryCode
      description: Two letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code. This can be used in the `country_code` query parameter of multiple endpoints to limit results to the specific country.
      type: string
      example: us
      pattern: ^[a-z]+
      minLength: 2
      maxLength: 2
    Response:
      title: response
      type: object
      description: A single response option for a question.
      example:
        id: '1'
        label: Several times a day
      properties:
        id:
          $ref: '#/components/schemas/ResponseID'
        label:
          $ref: '#/components/schemas/ResponseLabel'
    ResponseLabel:
      title: ResponseLabel
      type: string
      description: The full textual label for the response, as selected by a respondent.
      example: Very Favorable
    Score:
      title: Score
      description: The representation of a score and its relevant metadata. If entity type is present, then an entity that satisfies the entity type must be passed into [/surveys/syndicated/scores](#POST-postSurveysSyndicatedScores). If `components` is present, at least one component ID must be supplied in `component_ids` when running the score.
      type: object
      example:
        id: 7fa7d4a5-8b79-462c-b9ae-03a0431cb5e5
        label: Avon Favorability
      properties:
        id:
          $ref: '#/components/schemas/ScoreID'
        label:
          type: string
          description: A short label describing the score.
        description:
          type: string
          description: A description of the score.
        entity_type:
          $ref: '#/components/schemas/EntityType'
        components:
          type: array
          description: The components available for this score. Scores such as "Price Surprise" and "Unavailability" expose components that restrict the calculation to a subset of categories (for example "home_appliances"). If this field is present, at least one component ID must be provided in `component_ids` when running the score.
          items:
            type: object
            description: A component available for this score.
            properties:
              id:
                type: string
                description: The unique identifier for the component.
                example: home_appliances
            required:
            - id
    DataSourceID:
      title: Data Source ID
      description: The unique identifier for a data source.
      type: string
      format: uuid
      example: 00de2081-e013-411d-823c-cd483283e38d
    Error:
      type: object
      description: Error message.
      additionalProperties: false
      example:
        code: 500
        status: Internal Server Error
        errors:
        - Oops, something went wrong
      properties:
        code:
          type: integer
          description: Numeric HTTP status code.
          example: 500
          format: int32
          minimum: 100
          maximum: 599
        status:
          type: string
          description: Text description of HTTP status code.
          example: Internal Server Error
        errors:
          type: array
          description: Messages describing errors.
          items:
            title: error
            type: string
            description: A specific error message.
          example:
          - Oops, something went wrong
    QuestionID:
      title: Question ID
      description: The unique identifier for a question.
      type: string
      format: uuid
      example: a7ee637c-e5d1-4cf8-b484-8eb372f22941
    GetScoresBulkStatusOutput:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          description: The unique identifier for the bulk scores request.
          example: b1a2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          type: string
          description: The current status of the report request.
          enum:
          - processing
          - complete
          - error
          example: complete
        download_url:
          type: string
          format: uri
          description: URL to download the completed report. Only present when status is `complete`.
          example: https://example.com/report.parquet
        expires_at:
          type: string
          format: date-time
          description: Expiration time of the download URL. Only present when status is `complete`.
          example: '2025-01-01T12:00:00Z'
    Country:
      title: Country
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CountryCode'
        label:
          type: string
          description: The full name for the country.
      example:
        code: us
        label: United States
      description: A country.
    DataSource:
      title: Data Source
      type: object
      description: A data source and the countries it supports.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the data source.
          example: 00de2081-e013-411d-823c-cd483283e38d
        name:
          type: string
          description: The human-readable name of the data source.
          example: Daily Tracker
        countries:
          type: array
          description: The countries the score is available in for this data source.
          items:
            $ref: '#/components/schemas/Country'
  headers:
    X-Rate-Limit-Remaining:
      description: The number of remaining requests in the current rate limit period.
      schema:
        type: integer
        example: 179
    X-Rate-Limit-Reset:
      description: The time at which the rate limit resets, specified in UTC epoch time (in milliseconds).
      schema:
        type: integer
        example: 1633538752414
    X-Rate-Limit-Limit:
      description: The rate limit ceiling that is applicable for the current request.
      schema:
        type: integer
        example: 200
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: Username and password credentials for initial authentication.
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer header authentication for performing regular requests.
    RefreshToken:
      type: http
      scheme: bearer
      description: Refresh Token bearer header authentication for renewing tokens.
