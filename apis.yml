apis:
- aid: morning-consult:morning-consult-api
  name: Morning Consult API
  description: 'The Morning Consult API provides access to the syndicated survey data
    that powers Morning Consult Intelligence. Metadata (Lookup) operations discover
    the data sources, countries, categories, entities, questions and scores available
    to a subscription; Data operations return aggregated question responses and computed
    scores for a custom audience over a date range; bulk operations queue asynchronous
    Data Bridge jobs that return Parquet; and an AI operation resolves a natural-language
    query against the respondent corpus. Authentication is a Basic-credential exchange
    at POST /auth/token for a short-lived JWT plus a refresh token.'
