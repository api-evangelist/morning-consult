aid: morning-consult
name: Morning Consult
description: 'Morning Consult is a decision intelligence company that fields more than
  30,000 online surveys every day across 45+ countries, turning continuous consumer
  interviewing into brand, reputation, economic and category tracking data. Its flagship
  product, Morning Consult Intelligence (MCI), exposes that data programmatically through
  the Morning Consult API — a versioned REST API at api.morningconsult.com/v1 that
  serves metadata lookup (data sources, countries, categories, entities, questions,
  scores), on-demand aggregated survey responses and scores with custom audience filtering
  and calendar-interval aggregation, asynchronous bulk/Data Bridge requests that return
  Parquet files for Snowflake, BigQuery and Databricks, and an AI resolve endpoint that
  answers natural-language questions against the syndicated survey corpus.'
