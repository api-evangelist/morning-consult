  fields: [score_id, entity_id, component_ids]
- name: Audience
  schema: '#/components/schemas/Audience'
  description: A recursive boolean expression over question/response matches that
    filters which respondents are counted. Maximum 20 conditions per request.
  fields: [match, and, or, not]
- name: TimeseriesDataPoint
  schema: '#/components/schemas/TimeseriesDataPoint'
  description: One interval of aggregated question responses.
  fields: [date, total_n, responses]
- name: DataPoint
  schema: '#/components/schemas/DataPoint'
  description: The percentage of an audience that selected one response option in an
