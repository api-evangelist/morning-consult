- name: Score
  schema: '#/components/schemas/Score'
  description: A named metric computed from survey data, optionally composed of
    components and bound to an entity type.
  fields: [id, label, description, entity_type, components]
  discovered_by: getScores
- name: NamedScore
  schema: '#/components/schemas/NamedScore'
  description: A selection of one score, optionally bound to an entity and a subset of
