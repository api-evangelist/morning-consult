summary: >-
  The Morning Consult data model is a survey-measurement graph, not a CRUD resource
  graph. A DataSource (e.g. the Daily Tracker) supports a set of Countries. Within a
  data source and country, a Question carries a Category, an optional Entity (the brand
  or subject it asks about) and a fixed set of Responses (the answer options a
  respondent could pick). Data requests project that structure over time: a Response
  becomes a DataPoint inside a TimeseriesDataPoint, and a Score — a named metric such
  as Net Favorability, optionally composed of components and bound to an entity type —
  becomes a ScoreDataPoint. Audiences are recursive boolean expressions over the same
  question/response IDs, which is why a question is simultaneously a thing you measure
  and a thing you filter by.
id_conventions:
  format: UUID
  ids:
  - field: data_source_id
    entity: DataSource
    validation: must be a valid UUID
  - field: question_id
    entity: Question
    validation: must be a valid UUID; stable forever, safe to cache permanently
  - field: score_id
    entity: Score
  - field: entity_id
    entity: Entity
  - field: response_id
    entity: Response
  - field: request_id
    entity: BulkRequest
  - field: country_code
    entity: Country
    validation: 2 characters
