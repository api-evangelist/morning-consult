examples:
- name: Exchange credentials for a JWT
  operation: postAuthToken
  request: |
    curl --fail --silent --show-error \
      --request POST \
      --user <username:password> \
      --url "https://api.morningconsult.com/v1/auth/token"
  response_shape:
    token_type: Bearer
    expires_in: 3600
    id_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxM
    refresh_token: eyJxdWVyeSI6ImRvZ3MifQ==
  source: https://api.morningconsult.com/docs/#authentication
- name: Page through metadata with a pagination token
  operation: getDataSourceQuestions
  request: |
    curl --fail --silent --show-error \
      --header "Authorization: Bearer <api_token>" \
      --url "https://api.morningconsult.com/v1/surveys/syndicated/questions?pagination_token=eyJwYWdlX3NpemUiOjUwLCJzZWFyY2hfYWZ0ZXIiOlswLDk0XX0"
  note: >-
    The published pagination walkthrough still uses the deprecated
    /surveys/syndicated/questions route; the current equivalent is
    GET /data_sources/{data_source_id}/countries/{country_code}/questions.
  source: https://api.morningconsult.com/docs/#pagination
- name: Aggregated responses over an explicit date range
  operation: postResponses
  request_body:
    data_source_id: 00de2081-e013-411d-823c-cd483283e38d
    question_id: b807c287-c2fe-4319-8316-afa93f0f3527
    min_date: '2025-01-01'
    max_date: '2025-03-31'
  source: https://api.morningconsult.com/docs/#date-ranges
- name: Natural-language query against the survey corpus
  operation: postAIResolve
