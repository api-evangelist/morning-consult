search_result: >-
  No Morning Consult MCP server exists. Searched the MCP registries, npm
  (@modelcontextprotocol and @morningconsult scopes), github.com/morningconsult, the
  published documentation at https://api.morningconsult.com/docs/ and
  https://morningconsult.com/llms.txt. Probed api.morningconsult.com for
  /.well-known/oauth-protected-resource, /.well-known/oauth-authorization-server and
  /.well-known/agent-card.json — all 404. Morning Consult DOES ship an agentic surface,
  but it is a REST operation (POST /ai/resolve, natural-language query over the survey
  corpus) and a set of hosted "AI Research Agents" in the MCI product, not MCP.
  No `MCPServer` pointer is wired in apis.yml, because no server is published.
